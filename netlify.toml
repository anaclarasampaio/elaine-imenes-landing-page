# Site da Elaine Imenes na Netlify.
# A Netlify lê este arquivo sozinha: não precisa configurar comando nem pasta.

[build]
  command = "node _build/build.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# o painel e os arquivos de trabalho não entram no Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
